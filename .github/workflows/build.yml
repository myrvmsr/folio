name: Build and verify Folio
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: folio-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.title }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            title: Windows x64
            platform: win
            arch: x64
          - os: ubuntu-24.04
            title: Linux x64 (Ubuntu 24.04)
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libfuse2t64 desktop-file-utils
      - run: npm ci
      - name: Configure Linux source sandbox
        if: runner.os == 'Linux'
        run: |
          node -p "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%u:%a' node_modules/electron/dist/chrome-sandbox)" = '0:4755'
      - name: Unit tests
        run: npm test
      - name: Check translations
        run: npm run check-locales
      - name: Build renderer for UI tests
        run: npm run build
      - name: UI tests from sources
        if: runner.os == 'Windows'
        run: node scripts/test-e2e.mjs --label=source
      - name: UI tests from sources
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-e2e.mjs --label=source
        env:
          DEBUG: pw:browser
      - name: Build installers
        run: npm run dist:${{ matrix.platform }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'release/Folio-Setup.exe'
          $destination = Join-Path $PWD '.folio-checks/installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/smoke.mjs "--executable=$destination/Folio.exe" --label=installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-e2e.mjs "--executable=$destination/Folio.exe" --label=installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Linux DEB
        if: runner.os == 'Linux'
        env:
          DEBUG: pw:browser
        run: |
          sudo apt-get install -y ./release/Folio-Linux-x64.deb
          desktop-file-validate /usr/share/applications/com.folio.markdown.desktop
          grep -F 'text/markdown' /usr/share/applications/com.folio.markdown.desktop
          xvfb-run -a node scripts/smoke.mjs --executable=/opt/Folio/folio --label=deb
          xvfb-run -a node scripts/test-e2e.mjs --executable=/opt/Folio/folio --label=deb
      - name: Check Linux AppImage
        if: runner.os == 'Linux'
        env:
          DEBUG: pw:browser
        run: |
          chmod +x release/Folio-Linux-x64.AppImage
          xvfb-run -a node scripts/smoke.mjs "--executable=$PWD/release/Folio-Linux-x64.AppImage" --label=appimage
          xvfb-run -a node scripts/test-e2e.mjs "--executable=$PWD/release/Folio-Linux-x64.AppImage" --label=appimage
      - name: Compute installer SHA256
        run: node scripts/checksums.mjs
      - name: Collect verified results
        run: node scripts/collect-quality.mjs ${{ matrix.platform }}
      - name: Save checked installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Folio-*.exe
            release/Folio-*.AppImage
            release/Folio-*.deb
            release/SHA256SUMS.txt
            release/QUALITY.json
          if-no-files-found: error
          retention-days: 14
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            .folio-checks/*/*/capture.png
            .folio-checks/*/*/capture.png.pdf
            .folio-checks/*/*/capture.png.json
            .folio-checks/*/*/process.log
            .folio-checks/*/smoke-summary.json
            .folio-checks/unit/
            .folio-checks/locales/
            .folio-checks/e2e/*/results.json
            .folio-checks/e2e/*/junit.xml
            .folio-checks/e2e/*/artifacts/
            .folio-checks/e2e/*/html/
          include-hidden-files: true
          retention-days: 14
